name: Deno CI & Edge Function Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Lint & Test Supabase Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno Environment
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify Deno Version
        run: deno --version

      - name: Run Deno Lint
        run: deno lint supabase/functions/

      - name: Run Edge Function Test Suite
        run: deno test --allow-env --allow-net --allow-read supabase/functions/