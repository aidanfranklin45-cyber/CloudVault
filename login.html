<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudVault | Sign In</title>
    <link rel="icon" type="image/png" href="logo.png">
    <!-- PostHog Analytics -->

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
        input { transition: all 0.2s; }
        input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2); }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }

</head>
<body class="antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold tracking-tighter text-blue-600">CloudVault</a>
            <a href="index.html" class="text-sm font-semibold text-gray-500 hover:text-gray-900">← Back to Home</a>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center px-4 py-16 fade-in">
        <div class="bg-white p-8 sm:p-10 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
            
            <!-- Notice Banner (Inactivity Auto-Logout) -->
            <div id="auth-notice" class="hidden mb-6 p-4 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-800 text-xs font-semibold text-center leading-relaxed">
                🔒 You were automatically signed out after 30 minutes of inactivity for security.
            </div>

            <div class="text-center mb-8">
                <h1 id="auth-title" class="text-2xl font-bold text-gray-900">Welcome Back</h1>
                <p id="auth-subtitle" class="text-gray-500 text-sm mt-2">Sign in to access your vault.</p>
            </div>

            <!-- Auth Form -->
            <div class="space-y-4">
                <!-- Name field (sign-up only) -->
                <div id="name-field" class="hidden">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Full Name</label>
                    <input type="text" id="auth-name" placeholder="Jane Doe" class="w-full px-4 py-3 border border-gray-300 rounded-xl font-medium">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Email</label>
                    <input type="email" id="auth-email" placeholder="jane@example.com" class="w-full px-4 py-3 border border-gray-300 rounded-xl font-medium">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Password</label>
                    <input type="password" id="auth-password" placeholder="••••••••" class="w-full px-4 py-3 border border-gray-300 rounded-xl font-medium">
                </div>

                <!-- Remember Me Checkbox -->
                <div id="remember-me-field" class="flex items-center justify-between pt-1">
                    <label class="flex items-center text-xs font-semibold text-gray-600 cursor-pointer select-none">
                        <input type="checkbox" id="auth-remember-me" class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500 mr-2 cursor-pointer">
                        Remember me on this device
                    </label>
                </div>

                <!-- Phone field (sign-up only) -->
                <div id="phone-field" class="hidden">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Phone</label>
                    <input type="tel" id="auth-phone" placeholder="(555) 123-4567" class="w-full px-4 py-3 border border-gray-300 rounded-xl font-medium">
                </div>

                <p id="auth-error" class="text-red-500 text-sm font-medium hidden"></p>

                <button id="auth-submit" onclick="handleAuth()" class="w-full bg-blue-600 text-white px-4 py-4 rounded-xl font-bold text-lg hover:bg-blue-700 transition mt-4">
                    Sign In
                </button>
            </div>

            <div class="mt-6 text-center">
                <p class="text-sm text-gray-500">
                    <span id="toggle-text">Don't have an account?</span>
                    <button onclick="toggleMode()" class="text-blue-600 font-semibold hover:underline ml-1" id="toggle-btn">Sign Up</button>
                </p>
            </div>
        </div>
    </main>

    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <script>
        let isSignUp = false;

        // Role-based routing: staff → admin.html, customers → dashboard.html
        const STAFF_ROLES = ['executive', 'warehouse_manager', 'warehouse_worker'];

        supabase.auth.onAuthStateChange(async (event, session) => {
            if (!session) return;
            try {
                const profile = await getCachedUserProfile(session.user.id);
                if (profile && STAFF_ROLES.includes(profile.role)) {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'dashboard.html';
                }
            } catch (e) {
                // If profile fetch fails, default to customer dashboard
                window.location.href = 'dashboard.html';
            }
        });

        function toggleMode() {
            isSignUp = !isSignUp;
            document.getElementById('auth-title').textContent = isSignUp ? 'Create Your Vault' : 'Welcome Back';
            document.getElementById('auth-subtitle').textContent = isSignUp ? 'Sign up to get started.' : 'Sign in to access your vault.';
            document.getElementById('auth-submit').textContent = isSignUp ? 'Create Account' : 'Sign In';
            document.getElementById('toggle-text').textContent = isSignUp ? 'Already have an account?' : "Don't have an account?";
            document.getElementById('toggle-btn').textContent = isSignUp ? 'Sign In' : 'Sign Up';
            document.getElementById('name-field').classList.toggle('hidden', !isSignUp);
            document.getElementById('phone-field').classList.toggle('hidden', !isSignUp);
            document.getElementById('remember-me-field').classList.toggle('hidden', isSignUp);
            document.getElementById('auth-error').classList.add('hidden');
        }

        async function handleAuth() {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            const rememberCb = document.getElementById('auth-remember-me');
            const isRemember = rememberCb ? rememberCb.checked : false;
            const errEl = document.getElementById('auth-error');
            errEl.classList.add('hidden');

            if (!email || !password) {
                errEl.textContent = 'Please fill in all required fields.';
                errEl.classList.remove('hidden');
                return;
            }

            // Save Remember Me preference for customStorageEngine
            localStorage.setItem('cv_remember_me', isRemember ? 'true' : 'false');

            try {
                if (isSignUp) {
                    const name = document.getElementById('auth-name').value.trim();
                    const phone = document.getElementById('auth-phone').value.trim();

                    if (!name) {
                        errEl.textContent = 'Please enter your name.';
                        errEl.classList.remove('hidden');
                        return;
                    }

                    // Create Supabase Auth account.
                    // The trigger `on_auth_user_created` will create the user profile in public.users automatically.
                    const { data, error } = await supabase.auth.signUp({
                        email: email,
                        password: password,
                        options: {
                            data: {
                                name: name,
                                phone: phone
                            }
                        }
                    });
                    if (error) throw error;
                } else {
                    const { data, error } = await supabase.auth.signInWithPassword({
                        email: email,
                        password: password
                    });
                    if (error) throw error;
                }
            } catch (err) {
                console.error(err);
                let msg = err.message || 'Something went wrong. Please try again.';
                errEl.textContent = msg;
                errEl.classList.remove('hidden');
            }
        }

        // Check URL params for inactivity auto-logout notice
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get('reason') === 'inactivity') {
                const noticeEl = document.getElementById('auth-notice');
                if (noticeEl) noticeEl.classList.remove('hidden');
            }
        });

        // Phone formatting
        document.getElementById('auth-phone').addEventListener('input', function (e) {
            let x = e.target.value.replace(/\D/g, '').match(/(\d{0,3})(\d{0,3})(\d{0,4})/);
            e.target.value = !x[2] ? x[1] : '(' + x[1] + ') ' + x[2] + (x[3] ? '-' + x[3] : '');
        });
    </script>
</body>
</html>
